name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel previously running PR jobs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  lint:
    name: Lint sources
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          cache: pip
      - name: Install python packages
        run: pip install pre-commit
      - name: Run linters
        run: pre-commit run --all-files --verbose --show-diff-on-failure

  build:
    name: Build (ROS 2 Jazzy)
    runs-on: ubuntu-24.04
    container: ros:jazzy
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: src/ar4
      - name: Install dependencies
        # topic_based_ros2_control has no Jazzy release; only ar4_isaac needs it at runtime,
        # and the Isaac image builds it from source.
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src -y --skip-keys topic_based_ros2_control
      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --cmake-args -DCMAKE_BUILD_TYPE=Release --event-handlers console_cohesion+
